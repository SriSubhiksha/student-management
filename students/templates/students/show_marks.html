<!DOCTYPE html>
<html>

<head>

    <title>Student Marks</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3>

                    Student Mark Details

                </h3>

            </div>

            <div class="card-body">

                <h4 class="mb-4">

                    Student :
                    <strong>{{ student.name }}</strong>

                </h4>

                <table class="table table-bordered">

                    <tr>

                        <th width="40%">
                            Tamil
                        </th>

                        <td>
                            {{ marks.tamil }}
                        </td>

                    </tr>

                    <tr>

                        <th>
                            English
                        </th>

                        <td>
                            {{ marks.english }}
                        </td>

                    </tr>

                    <tr>

                        <th>
                            Maths
                        </th>

                        <td>
                            {{ marks.maths }}
                        </td>

                    </tr>

                    <tr>

                        <th>
                            Science
                        </th>

                        <td>
                            {{ marks.science }}
                        </td>

                    </tr>

                    <tr>

                        <th>
                            Social Science
                        </th>

                        <td>
                            {{ marks.social_science }}
                        </td>

                    </tr>

                    <tr class="table-success">

                        <th>
                            Total Marks
                        </th>

                        <td>

                            <strong>

                            {{ marks.total }}

                        </strong>

                        </td>

                    </tr>

                    <tr class="table-info">

                        <th>
                            Average
                        </th>

                        <td>

                            <strong>

                            {{ marks.average }}

                        </strong>

                        </td>

                    </tr>

                </table>

                <a href="{% url 'student_list' %}" class="btn btn-secondary">

                Back
            </a>

                <a href="{% url 'enter_marks' student.id %}" class="btn btn-warning">
                    Edit Marks

                

            </a>

            </div>

        </div>

    </div>

</body>

</html>
