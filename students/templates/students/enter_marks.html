<!DOCTYPE html>
<html>

<head>

    <title>Enter Student Marks</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header bg-success text-white">

                        <h3>
                            Enter Student Marks
                        </h3>

                    </div>

                    <div class="card-body">

                        <h5 class="mb-4">

                            Student Name :
                            <strong>{{ student.name }}</strong>

                        </h5>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="row">

                                <div class="mb-3">

                                    <label class="form-label">
                            Tamil
                        </label> {{ form.tamil }}

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                            English
                        </label> {{ form.english }}

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                            Maths
                        </label> {{ form.maths }}

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                            Science
                        </label> {{ form.science }}

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                            Social Science
                        </label> {{ form.social_science }}

                                </div>

                            </div>

                            <hr>
                            <a href="{% url 'student_list' %}" class="btn btn-secondary">
                    Back
                    </a>





                            <button type="submit" class="btn btn-success">

                    Save Marks

                </button>

                            </a>

                        </form>

                    </div>

                </div>

            </div>

</body>

</html>
