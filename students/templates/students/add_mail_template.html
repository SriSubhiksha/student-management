<!DOCTYPE html>
<html>

<head>

    <title>Add Mail Template</title>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3>

                    Add New Mail Template

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">

                        Template Title

                    </label> {{ form.title }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                        Subject

                    </label> {{ form.subject }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                        Mail Content

                    </label> {{ form.body }}

                    </div>

                    <button type="submit" class="btn btn-success">

                    Save Template

                </button>

                    <a href="{% url 'mail_templates' %}" class="btn btn-secondary">

                    Cancel

                </a>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
