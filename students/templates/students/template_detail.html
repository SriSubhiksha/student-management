<!DOCTYPE html>
<html>

<head>

    <title>Template Details</title>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3>

                    {{ template.title }}

                </h3>

            </div>

            <div class="card-body">

                <h5>
                    Subject
                </h5>

                <div class="border rounded p-3 mb-4">

                    {{ template.subject }}

                </div>

                <h5>
                    Mail Content
                </h5>

                <div class="border rounded p-3 bg-light">

                    <pre style="white-space: pre-wrap; font-family: Arial;">
{{ template.body }}
                </pre>

                </div>

            </div>

        </div>

        <div class="mt-3">

            <a href="{% url 'edit_mail_template' template.id %}" class="btn btn-warning">

        Edit Template

    </a>

            <a href="{% url 'mail_templates' %}" class="btn btn-secondary">

        Back

    </a>

        </div>
    </div>

    </div>

</body>

</html>
